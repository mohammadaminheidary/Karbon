<!doctype html>
<html lang="fa" dir="rtl" class="scroll-smooth">
  <head>
    <!-- ==================== Meta Information ==================== -->
    <meta charset="UTF-8" />
    <script src="../src/js/components/appearance.js"></script>
    <script src="../src/js/components/page-bootstrap.js"></script>
    <style>@view-transition { navigation: auto; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==================== Page Information ==================== -->
    <title>Karbon</title>
    <!-- ==================== Stylesheets ==================== -->
    <link rel="stylesheet" href="../src/output.css" />
    <!-- Fetch dashboard code alongside login resources without executing it. -->
    <link rel="modulepreload" href="../src/js/page/index.js" />
  </head>
    <body class="flex min-h-screen items-center justify-center overflow-x-hidden bg-[url('../assets/image/login-page/bg-login-page.webp')] bg-cover bg-center bg-no-repeat px-4 py-6 sm:px-6 md:px-8 lg:px-10">

    <!-- Login Form -->
    <form  id="loginForm" class="flex w-full max-w-[320px] flex-col items-center gap-y-4 rounded-[28px] border border-[#7ca9dc]/45 bg-[#071a38]/30 px-5 py-8 shadow-[0_25px_70px_-20px_rgba(0,0,0,0.75),0_0_35px_-10px_rgba(28,113,255,0.3)] backdrop-blur-xl transition-all duration-300 sm:max-w-85 sm:gap-y-4.5 sm:rounded-[30px] sm:px-6 sm:py-9 md:max-w-87.5 md:gap-y-5 md:px-7 md:py-10 lg:max-w-92.5 lg:gap-y-5.5 lg:rounded-4xl lg:px-8 lg:py-11 xl:max-w-97.5 xl:px-9 xl:py-12 2xl:max-w-102.5 2xl:px-10 2xl:py-13">

      <!-- Form Header -->
      <div class="w-full text-center">
        <h1 class="text-base font-bold tracking-wide text-white selection:bg-[#1d65d8] selection:text-white sm:text-xl md:text-xl lg:text-2xl">Karbon</h1>
        <p class="pt-1.5 text-[0.625rem] leading-relaxed text-[#aebed3] selection:bg-[#1d65d8] selection:text-white sm:pt-2 sm:text-sm lg:pt-3">ورود به پنل مدیریت کسب و کار</p>
      </div>

      <!-- Username -->
      <div class="group/input relative w-full">
        <input id="username" name="username" type="text" autocomplete="username" placeholder="نام کاربری خود را وارد کنید" class="peer w-full rounded-xl border border-[#607b9d]/70 bg-[#102544]/75 py-2 pr-10 pl-4 text-xs text-white caret-[#4d9cff] outline-none placeholder:font-medium placeholder:text-[#8fa3bd] transition-[border-color,box-shadow,background-color] duration-200 hover:border-[#7594bb] hover:bg-[#142b4d]/90 focus:border-[#2584ff] focus:bg-[#122b4f] focus:shadow-[0_0_0_1px_rgba(37,132,255,0.25),0_0_20px_rgba(37,132,255,0.12)] focus:ring-4 focus:ring-[#2584ff]/10 sm:py-2.5 sm:pr-11 sm:text-sm lg:py-3 lg:pr-12 lg:text-[0.95rem]" />

        <span aria-hidden="true" class="pointer-events-none absolute top-1/2 right-3.5 -translate-y-1/2 text-[#d4dfef] transition-colors duration-200 peer-focus:text-[#4d9cff] sm:right-4">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-4 w-4 sm:h-4.5 sm:w-4.5 lg:h-5 lg:w-5">
            <path d="M0 0h24v24H0z" fill="none" />
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
              <circle cx="12" cy="8" r="5" />
              <path d="M20 21a8 8 0 0 0-16 0" />
            </g>
          </svg>
        </span>
      </div>

      <!-- Password -->
      <div class="relative w-full">
        <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="رمز ورود" class="peer w-full rounded-xl border border-[#607b9d]/70 bg-[#102544]/75 py-2 pr-10 pl-10 text-xs text-white caret-[#4d9cff] outline-none placeholder:font-medium placeholder:text-[#8fa3bd] transition-[border-color,box-shadow,background-color] duration-200 hover:border-[#7594bb] hover:bg-[#142b4d]/90 focus:border-[#2584ff] focus:bg-[#122b4f] focus:shadow-[0_0_0_1px_rgba(37,132,255,0.25),0_0_20px_rgba(37,132,255,0.12)] focus:ring-4 focus:ring-[#2584ff]/10 sm:py-2.5 sm:pr-11 sm:pl-11 sm:text-sm lg:py-3 lg:pr-12 lg:pl-12 lg:text-[0.95rem]" />

        <span aria-hidden="true" class="pointer-events-none absolute top-1/2 right-3.5 -translate-y-1/2 text-[#d4dfef] transition-colors duration-200 peer-focus:text-[#4d9cff] sm:right-4">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-4 w-4 sm:h-4.5 sm:w-4.5 lg:h-5 lg:w-5">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2M9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9zm9 14H6V10h12zm-6-3c1.1 0-2 0-2-2s-.9-2-2-2s-2 .9-2 2s.9 2 2 2" />
          </svg>
        </span>

        <button id="toggleEye" type="button" aria-label="نمایش رمز عبور" class="absolute top-1/2 left-2 -translate-y-1/2 rounded-full p-1 text-[#9fb3cd] outline-none transition-[color,background-color,transform] duration-200 hover:bg-[#2584ff]/10 hover:text-[#4d9cff] focus-visible:ring-2 focus-visible:ring-[#2584ff]/40 sm:left-2.5 sm:p-1.5 lg:left-3 lg:p-2">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 sm:h-4.5 sm:w-4.5 lg:h-5 lg:w-5">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
            <circle cx="12" cy="12" r="3" />
            <line id="eyeSlash" x1="3" y1="21" x2="21" y2="3" />
          </svg>
        </button>
      </div>

      <!-- Login Button -->
      <button type="submit" class="group relative flex w-full cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-xl bg-[#1769e8] py-2.5 text-xs font-bold text-white shadow-[0_10px_25px_-8px_rgba(23,105,232,0.7)] transition-[transform,box-shadow,background-color] duration-300 ease-out hover:-translate-y-0.5 hover:bg-[#2478f2] hover:shadow-[0_14px_30px_-8px_rgba(23,105,232,0.85)] focus-visible:ring-2 focus-visible:ring-[#3e91ff]/60 focus-visible:ring-offset-2 focus-visible:ring-offset-[#071a38] focus-visible:outline-none active:translate-y-0 active:scale-[0.99] active:bg-[#125dcc] active:shadow-[0_8px_18px_-8px_rgba(23,105,232,0.7)] sm:py-3 sm:text-sm lg:py-3.5 lg:text-base">
        <span class="relative z-10">ورود به حساب</span>
      </button>

    </form>
      <!-- Password Toggle -->
       <script type="module" data-page-entry src="../src/js/main.js"></script>
  </body>
</html>
