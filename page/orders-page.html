        <section class="orders-summary" aria-label="خلاصه سفارشات">

            <button
              type="button"
              id="activeOrdersTab"
              class="orders-tab"
              role="tab"
              aria-selected="true"
              aria-controls="activeOrdersPanel"
              tabindex="0"
            >
              سفارشات فعال
            </button>
            <button
              type="button"
              id="completedOrdersTab"
              class="orders-tab"
              role="tab"
              aria-selected="false"
              aria-controls="completedOrdersPanel"
              tabindex="-1"
            >
              سفارشات تکمیل‌شده
            </button>
          </div>
          <div
            id="activeOrdersPanel"
            class="orders-panel"
            role="tabpanel"
            aria-labelledby="activeOrdersTab"
            tabindex="0"
          ></div>
          <div
            id="completedOrdersPanel"
            class="orders-panel"
            role="tabpanel"
            aria-labelledby="completedOrdersTab"
            tabindex="0"
            hidden
          ></div>
        </section>
